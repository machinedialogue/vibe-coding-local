
version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    expose:
      - "11434"
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_DEBUG=1
      - GIN_MODE=debug

  mitmproxy:
    image: mitmproxy/mitmproxy:latest
    container_name: mitmproxy
    restart: unless-stopped
    command: mitmweb --web-host 0.0.0.0 --mode reverse:http://ollama:11434 -vvv --set web_password=''
    ports:
      - "8080:8080"   # proxy endpoint
      - "8081:8081"   # mitmweb UI
    depends_on:
      - ollama

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    depends_on:
      - mitmproxy
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://mitmproxy:8080
      - WEBUI_AUTH=false
    volumes:
      - ./data/open-webui:/app/backend/data
